name: Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: npm install -g appium && appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run regression tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_4
          avd-name: regression_avd
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash scripts/run_tests.sh

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --silent
          allure generate target/allure-results --clean -o target/site/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-report/
          retention-days: 14

      - name: Parse test results
        if: always()
        id: results
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, glob, os
          passed = failed = errors = skipped = 0
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              r = ET.parse(f).getroot()
              t  = int(r.get('tests',     0))
              fl = int(r.get('failures',  0))
              er = int(r.get('errors',    0))
              sk = int(r.get('skipped',   0))
              passed  += t - fl - er - sk
              failed  += fl
              errors  += er
              skipped += sk
          total = passed + failed + errors + skipped
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f'passed={passed}\nfailed={failed}\nerrors={errors}\nskipped={skipped}\ntotal={total}\n')
          EOF

      - name: Zip Allure report
        if: always()
        run: zip -r allure-report.zip target/site/allure-report/

      - name: Send email with Allure report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ job.status == 'success' && 'PASSED' || 'FAILED' }}] Regression Run #${{ github.run_number }} | ✅ ${{ steps.results.outputs.passed }} / ❌ ${{ steps.results.outputs.failed }} / Total ${{ steps.results.outputs.total }}"
          to: ${{ secrets.MAIL_TO }}
          from: Fluent Regression CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Regression Test Run Summary
            ─────────────────────────────
            Run #   : ${{ github.run_number }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Status  : ${{ job.status }}

            Test Results
            ─────────────────────────────
            ✅ Passed  : ${{ steps.results.outputs.passed }}
            ❌ Failed  : ${{ steps.results.outputs.failed }}
            ⚠️ Errors  : ${{ steps.results.outputs.errors }}
            ⏭ Skipped : ${{ steps.results.outputs.skipped }}
            📊 Total   : ${{ steps.results.outputs.total }}

            The full Allure HTML report (with pie chart) is attached.
            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: allure-report.zip

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          retention-days: 14

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
