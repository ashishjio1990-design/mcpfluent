# ── JUnit 5 Parallel Execution ─────────────────────────────────────────────
# Enable parallel execution engine
junit.jupiter.execution.parallel.enabled=true

# Different test CLASSES run concurrently; methods within a class run
# sequentially (safe for Appium — prevents two methods fighting over
# the same app session on one device).
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Fixed thread pool. Override at runtime:
#   mvn test -Dparallel.count=3
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2
